<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Coffee beans texture background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2518"/>
      <stop offset="100%" stop-color="#24160f"/>
    </linearGradient>
    <radialGradient id="beanA" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#9a6c4e"/>
      <stop offset="55%" stop-color="#704a34"/>
      <stop offset="100%" stop-color="#3f281c"/>
    </radialGradient>
    <radialGradient id="beanB" cx="35%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#a77755"/>
      <stop offset="55%" stop-color="#7b5339"/>
      <stop offset="100%" stop-color="#492e20"/>
    </radialGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <filter id="softFocus" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="45%" r="65%">
      <stop offset="58%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>

    <g id="beanShape">
      <ellipse rx="58" ry="82" fill="url(#beanA)"/>
      <ellipse rx="56" ry="80" fill="url(#beanB)" opacity="0.45"/>
      <path d="M-10 -64 C 16 -28, 18 34, -4 70" fill="none" stroke="#b88a66" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
      <path d="M-4 -60 C 14 -30, 14 30, 0 66" fill="none" stroke="#3b2317" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="-18" cy="-34" rx="22" ry="14" fill="#f0bf98" opacity="0.18"/>
    </g>
  </defs>

  <rect width="2200" height="700" fill="url(#bg)"/>

  <g opacity="0.96" filter="url(#softFocus)">
    <use href="#beanShape" transform="translate(120 130) rotate(-14) scale(1.18)"/>
    <use href="#beanShape" transform="translate(340 250) rotate(9) scale(1.02)"/>
    <use href="#beanShape" transform="translate(560 142) rotate(16) scale(1.12)"/>
    <use href="#beanShape" transform="translate(790 290) rotate(-10) scale(1.08)"/>
    <use href="#beanShape" transform="translate(1020 145) rotate(12) scale(1.18)"/>
    <use href="#beanShape" transform="translate(1250 280) rotate(-16) scale(1.05)"/>
    <use href="#beanShape" transform="translate(1480 135) rotate(11) scale(1.16)"/>
    <use href="#beanShape" transform="translate(1710 292) rotate(-8) scale(1.04)"/>
    <use href="#beanShape" transform="translate(1940 152) rotate(15) scale(1.09)"/>
    <use href="#beanShape" transform="translate(2160 260) rotate(-11) scale(1.15)"/>
  </g>

  <rect width="2200" height="700" filter="url(#grain)"/>
  <rect width="2200" height="700" fill="url(#vignette)"/>
</svg>
